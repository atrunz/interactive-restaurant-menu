<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Restaurant Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>Alex Bistro</h1>
    <h2>Don't matter what I say, you can't read this anyway</h2>
    <p>ffffffffffffff</p>
  </header>

  <section class="menu-controls">
    <button class="menu-btn" data-category="breakfast">Food <image src="food-icon.png" alt="Food" /> </button>
    <button class="menu-btn" data-category="lunch">Drink <image src="drink-icon.png" alt="Drink" /> </button>
    <button class="menu-btn" data-category="brunch">Music <image src="music-icon.png" alt="Music" /> </button>
    <button class="menu-btn" data-category="dinner">Car <image src="car-icon.png" alt="Car" /> </button>
    <button class="menu-btn" data-category="happyHour">Game <image src="game-icon.png" alt="Game" /> </button>
    <button class="menu-btn" data-category="drinks">Alex<image src="alex-icon.png" alt="Alex" /> </button>
    <button class="menu-btn" data-category="desserts">Desserts</button>
<button class="menu-btn" data-category="kids">Kids</button>
<button class="menu-btn" data-category="seasonal">Seasonal</button>
  </section>

  <main class="menu-section">
    <h2 id="menu-title">Menu</h2>
    <div id="menu-display">
        
      <p>Select a category to view menu items.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
